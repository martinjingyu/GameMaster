[project]
name = "gamemaster"
version = "0.1.0"
description = "A channel-gateway friendly Blood on the Clocktower storyteller agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "GameMaster Contributors" }
]
dependencies = []

[project.scripts]
gamemaster = "gamemaster.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
